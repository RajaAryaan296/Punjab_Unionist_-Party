<section>
  <h2>Become a Member</h2>
  <form name="join-form" method="POST" data-netlify="true">
    <label for="name">Full Name:</label><br>
    <input type="text" name="name" required /><br><br>

    <label for="tribe">Tribe:</label><br>
    <input type="text" name="tribe" required /><br><br>

    <label for="reason">Why do you want to join?</label><br>
    <textarea name="reason" rows="6" required></textarea><br><br>

    <button type="submit">Join Now</button>
  </form>
</section>
